<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Focus Guard Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 420px; padding: 16px; color: #1a1a1a; }
    label { display: block; margin-top: 12px; font-size: 13px; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-top: 4px; font-size: 13px; }
    textarea { height: 80px; }
    button { margin-top: 14px; padding: 8px 14px; cursor: pointer; }
    #status { margin-top: 10px; font-size: 12px; color: #16a34a; }
    p.hint { font-size: 12px; color: #666; margin: 4px 0 0; }
  </style>
</head>
<body>
  <h3>Focus Guard</h3>
  <p class="hint">Paste the JWT you get from logging into AnalyticsAllrounder (DevTools &gt; Application &gt; Local Storage on the web app).</p>

  <label>API Base URL</label>
  <input id="apiBaseUrl" placeholder="http://localhost:5000/api" />

  <label>Auth Token</label>
  <input id="token" placeholder="Paste your JWT" />

  <label>Blocked sites (one per line)</label>
  <textarea id="blocklist"></textarea>

  <label><input id="enabled" type="checkbox" style="width:auto;display:inline" /> Enabled</label>

  <button id="save">Save</button>
  <div id="status"></div>

  <script src="options.js" type="module"></script>
</body>
</html>
